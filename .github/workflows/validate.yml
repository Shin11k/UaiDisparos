name: Validate build

on:
  push:
    branches: [main, migration/postgres-local]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Check private SQL gateway syntax
        run: node --check services/sql-gateway/server.mjs
      - name: Validate PowerShell installer syntax
        shell: pwsh
        run: |
          $parseErrors = @()
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/FINALIZAR_UAI_TESTE.ps1", [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { $parseErrors | Format-List; exit 1 }
      - name: Build Cloudflare staging bundle
        run: npm run cf:build
